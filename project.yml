name: NFBrowser
options:
  bundleIdPrefix: org.nflab

settings:
  base:
    MARKETING_VERSION: 0.2.14
    CURRENT_PROJECT_VERSION: 105

# Chromium (CEF) helper apps. CEF on macOS needs five of them in
# NFBrowser.app/Contents/Frameworks, named after the main executable.
targetTemplates:
  ChromiumHelper:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: ChromiumHelper
        excludes:
          - Info.plist
          - jit.entitlements
    dependencies:
      - framework: Vendor/CEF/dist/build/libcef_dll_wrapper/libcef_dll_wrapper.a
        embed: false
    settings:
      base:
        PRODUCT_NAME: "NFBrowser Helper${helperSuffix}"
        PRODUCT_BUNDLE_IDENTIFIER: "org.nflab.browser.helper${helperBundleSuffix}"
        INFOPLIST_FILE: ChromiumHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/CEF/dist"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/CEF/dist/build/libcef_dll_wrapper"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -fno-rtti"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO

packages:
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.2
  FaviconFinder:
    url: https://github.com/will-lumley/FavIconFinder
    exactVersion: 5.1.5
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    exactVersion: 4.2.2
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

targets:
  NFBrowser:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: NFBrowser
        excludes:
          - "Assets/Icons/**"
    resources:
      - path: NFBrowser/Shared/EmojiPicker/emoji-set.json
      - path: NFBrowser/Resources
        optional: true
      - path: NFBrowser/Resources/BrowserAgent/ora-browser.py
    dependencies:
      - package: Inject
      - package: FaviconFinder
      - package: SafariConverterLib
        product: ContentBlockerConverter
      - package: SwiftTerm
      - framework: Vendor/CEF/dist/build/libcef_dll_wrapper/libcef_dll_wrapper.a
        embed: false
      - target: NFBrowserHelper
        embed: false
        link: false
      - target: NFBrowserHelperAlerts
        embed: false
        link: false
      - target: NFBrowserHelperGPU
        embed: false
        link: false
      - target: NFBrowserHelperPlugin
        embed: false
        link: false
      - target: NFBrowserHelperRenderer
        embed: false
        link: false

    postBuildScripts:
      - name: "Embed Chromium"
        script: |
          "$SRCROOT/scripts/embed-cef.sh"
        basedOnDependencyAnalysis: false

    preBuildScripts:
      - name: "Copy Icon Bundle"
        inputFiles:
          - "$(SRCROOT)/NFBrowser/Assets/Icons/OraIcon.icon"
          - "$(SRCROOT)/NFBrowser/Assets/Icons/OraIconDev.icon"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/OraIcon.icon"
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/OraIconDev.icon"
        script: |
          ICON_SRC_DEV="$SRCROOT/NFBrowser/Assets/Icons/OraIconDev.icon"
          ICON_SRC_RELEASE="$SRCROOT/NFBrowser/Assets/Icons/OraIcon.icon"
          ICON_DST="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/"
          if [ "$CONFIGURATION" = "Debug" ]; then
              echo "Using OraIconDev.icon for Debug build"
              cp -R "$ICON_SRC_DEV" "$ICON_DST"
          else
              echo "Using OraIcon.icon for Release build"
              cp -R "$ICON_SRC_RELEASE" "$ICON_DST"
          fi

    info:
      path: NFBrowser/Info/Info.plist
      properties:
        CFBundleDisplayName: NFBrowser
        NSCameraUsageDescription: "Allows websites to use the camera, for example during video calls."
        NSMicrophoneUsageDescription: "Allows websites to use the microphone, for example during calls or dictation."
        CFBundleURLTypes:
          - CFBundleURLName: NFBrowser
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web URL
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.url
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.xhtml
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.web-browser

    entitlements:
      path: NFBrowser/Info/NFBrowser-debug.entitlements

    settings:
      base:
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: NFBrowser
        PRODUCT_MODULE_NAME: NFBrowser
        PRODUCT_BUNDLE_IDENTIFIER: org.nflab.browser
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: NFBrowser/Core/BrowserEngine/Chromium/Bridge/NFChromiumBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/CEF/dist"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/CEF/dist/build/libcef_dll_wrapper"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -fno-rtti"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: OraIconDev
          CODE_SIGN_ENTITLEMENTS: NFBrowser/Info/NFBrowser-debug.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Developer ID Application"
          EMIT_FRONTEND_COMMAND_LINES: YES
          OTHER_LDFLAGS: "-Xlinker -interposable"
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: OraIcon
          CODE_SIGN_ENTITLEMENTS: NFBrowser/Info/NFBrowser.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES

  NFBrowserTests:
    type: bundle.unit-test
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: NFBrowserTests
    dependencies:
      - target: NFBrowser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NFBrowser.app/Contents/MacOS/NFBrowser"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NFBrowserUITests:
    type: bundle.ui-testing
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: NFBrowserUITests
    dependencies:
      - target: NFBrowser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  NFBrowserHelper:
    templates:
      - ChromiumHelper
    templateAttributes:
      helperSuffix: ""
      helperBundleSuffix: ""

  NFBrowserHelperAlerts:
    templates:
      - ChromiumHelper
    templateAttributes:
      helperSuffix: " (Alerts)"
      helperBundleSuffix: ".alerts"

  NFBrowserHelperGPU:
    templates:
      - ChromiumHelper
    templateAttributes:
      helperSuffix: " (GPU)"
      helperBundleSuffix: ".gpu"

  NFBrowserHelperPlugin:
    templates:
      - ChromiumHelper
    templateAttributes:
      helperSuffix: " (Plugin)"
      helperBundleSuffix: ".plugin"

  NFBrowserHelperRenderer:
    templates:
      - ChromiumHelper
    templateAttributes:
      helperSuffix: " (Renderer)"
      helperBundleSuffix: ".renderer"

schemes:
  NFBrowser:
    shared: true
    build:
      targets:
        NFBrowser: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NFBrowserTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
